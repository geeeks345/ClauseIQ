services:
  # ClauseIQ React Frontend (Static Site on Render)
  - type: web
    name: clauseiq-frontend
    runtime: static
    rootDir: frontEnd
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://clauseiq-backend-vbfc.onrender.com/api/v1
